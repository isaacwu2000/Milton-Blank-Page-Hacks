[project]
name = "sportsbuilder-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "python-multipart==0.0.20",
  "python-dotenv==1.2.1",
  "psycopg[binary,pool]==3.2.12",
  "boto3==1.40.65",
  "numpy==2.2.6",
  "scipy==1.16.3",
  "opencv-python-headless==4.12.0.88",
  "Pillow==11.3.0",
  "transformers==4.57.1",
  "torch==2.9.0",
  "torchvision==0.24.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40,<1.41",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["server", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Railway uses CPU inference. macOS keeps its normal PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
