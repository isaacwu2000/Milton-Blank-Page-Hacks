worker_processes 1;
pid /tmp/sportsbuilder-nginx.pid;
error_log /opt/sportsbuilder/.sportsbuilder/nginx-error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8000;
        server_name _;
        root /opt/sportsbuilder/Web/frontend/dist;
        client_max_body_size 101m;
        client_body_timeout 120s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location ~ ^/(api|agent)(/|$) {
            # Public clients cannot impersonate the agent's private save requests.
            proxy_set_header X-Agent-Secret "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1000s;
            proxy_send_timeout 120s;
            if ($uri ~ ^/agent) { proxy_pass http://127.0.0.1:3001; }
            if ($uri ~ ^/api) { proxy_pass http://127.0.0.1:8080; }
        }
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
